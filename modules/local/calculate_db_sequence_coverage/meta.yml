---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "calculate_db_sequence_coverage"
description: "Fraction of curated sequences per database layer recovered by a tool run."
keywords:
  - coverage
  - sequence
  - benchmark
tools:
  - "calculate_db_sequence_coverage":
      description: "Fraction of curated sequences per database layer recovered by a tool run."
      homepage: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/calculate_db_sequence_coverage/"
      documentation: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/calculate_db_sequence_coverage/"
      tool_dev_url: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/calculate_db_sequence_coverage/"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', tool:'proteinfamilies' ]`
    - original_counts:
        type: file
        description: "Per-family original sequence counts from CALCULATE_SEQUENCE_STATS."
        pattern: "*.txt"
  - - metadata:
        type: file
        description: "Sampled family metadata CSV emitted by PRE."
        pattern: "*.{csv,tsv}"
  - - msa_root:
        type: directory
        description: "PRE `sampled_fasta/`: per-database curated original family FASTA files."
  - - id_registry:
        type: file
        description: "PRE `id_registry.tsv`: the authoritative universe_id -> parent_id / source_type / db_layer map."
        pattern: "*.tsv"
  - - pre_universe_fasta:
        type: file
        description: "PRE `combined_decoy.faa`: the exact FASTA the benchmarked tool was fed."
        pattern: "*.{faa,fasta}"
  - - pre_universe_sha256:
        type: file
        description: "PRE `universe.sha256`: checksum pinning results to the universe they were scored against."
        pattern: "*.sha256"
  - - benchmark_ids:
        type: file
        description: "`bin/benchmark_ids.py`, staged as a library (Nextflow puts bin/ on PATH, not PYTHONPATH)."
        pattern: "*.py"
  - - post_common:
        type: file
        description: "`bin/post_common.py`, staged as a library (Nextflow puts bin/ on PATH, not PYTHONPATH)."
        pattern: "*.py"
output:
  coverage:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', tool:'proteinfamilies' ]`
      - "sequence_coverage.txt":
          type: file
          description: "Per-db-layer sequence coverage."
          pattern: "sequence_coverage.txt"
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version 2>&1 | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_biopython:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - biopython:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('biopython'))":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version 2>&1 | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - biopython:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('biopython'))":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
