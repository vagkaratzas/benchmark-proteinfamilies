---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "produce_db_stacked_barplot"
description: "Stacked barplot of matches per database layer."
keywords:
  - plot
  - barplot
  - report
tools:
  - "produce_db_stacked_barplot":
      description: "Stacked barplot of matches per database layer."
      homepage: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/produce_db_stacked_barplot/"
      documentation: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/produce_db_stacked_barplot/"
      tool_dev_url: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/produce_db_stacked_barplot/"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', tool:'proteinfamilies' ]`
    - jaccard_edgelist:
        type: file
        description: "Jaccard edgelist from CALCULATE_JACCARD_SIMILARITY."
        pattern: "*.csv"
output:
  barplot:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', tool:'proteinfamilies' ]`
      - "stacked_barplot.png":
          type: file
          description: "Stacked barplot PNG."
          pattern: "stacked_barplot.png"
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version 2>&1 | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_matplotlib:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - matplotlib:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('matplotlib'))":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pandas:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('pandas'))":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version 2>&1 | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - matplotlib:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('matplotlib'))":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pandas:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('pandas'))":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
