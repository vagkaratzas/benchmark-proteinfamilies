---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "analyze_splits_merges"
description: "Measure directional split/merge topology between generated and curated families, within a db_layer."
keywords:
  - split
  - merge
  - topology
  - benchmark
tools:
  - "analyze_splits_merges":
      description: "Measure directional split/merge topology between generated and curated families, within a db_layer."
      homepage: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/analyze_splits_merges/"
      documentation: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/analyze_splits_merges/"
      tool_dev_url: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/analyze_splits_merges/"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', tool:'proteinfamilies' ]`
    - msa_dir:
        type: directory
        description: "Full-family MSA directory emitted by the benchmarked tool; the sole membership source."
    - clustering_tsv:
        type: file
        description: "Optional tool clustering TSV; drives `cluster_count` and cross-checks MSA completeness."
        pattern: "*.tsv"
  - - sampled_fasta:
        type: directory
        description: "PRE `sampled_fasta/`: per-database curated original family FASTA files."
  - - metadata:
        type: file
        description: "Sampled family metadata CSV emitted by PRE."
        pattern: "*.{csv,tsv}"
  - - id_registry:
        type: file
        description: "PRE `id_registry.tsv`: the authoritative universe_id -> parent_id / source_type / db_layer map."
        pattern: "*.tsv"
  - - pre_universe_fasta:
        type: file
        description: "PRE `combined_decoy.faa`: the exact FASTA the benchmarked tool was fed."
        pattern: "*.{faa,fasta}"
  - - pre_universe_sha256:
        type: file
        description: "PRE `universe.sha256`: checksum pinning results to the universe they were scored against."
        pattern: "*.sha256"
  - - benchmark_ids:
        type: file
        description: "`bin/benchmark_ids.py`, staged as a library (Nextflow puts bin/ on PATH, not PYTHONPATH)."
        pattern: "*.py"
  - - post_common:
        type: file
        description: "`bin/post_common.py`, staged as a library (Nextflow puts bin/ on PATH, not PYTHONPATH)."
        pattern: "*.py"
  - - association_threshold:
        type: number
        description: "Jaccard floor for an edge to count as an association."
  - - min_intersection_size:
        type: integer
        description: "Floor on |G n O| for an association."
output:
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', tool:'proteinfamilies' ]`
      - "split_merge_summary.tsv":
          type: file
          description: "Per-run split/merge counts."
          pattern: "split_merge_summary.tsv"
  overlap:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', tool:'proteinfamilies' ]`
      - "original_overlap_baseline.tsv":
          type: file
          description: "Original-overlap baseline separating tool-caused from curation-caused merges."
          pattern: "original_overlap_baseline.tsv"
  mqc:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', tool:'proteinfamilies' ]`
      - "split_merge_summary_mqc.csv":
          type: file
          description: "MultiQC-ready CSV of the split/merge summary."
          pattern: "split_merge_summary_mqc.csv"
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version 2>&1 | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_biopython:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - biopython:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('biopython'))":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version 2>&1 | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - biopython:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('biopython'))":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
