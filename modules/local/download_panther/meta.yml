---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "download_panther"
description: "Download the PANTHER curated family FASTA library."
keywords:
  - download
  - panther
  - database
tools:
  - "download_panther":
      description: "Download the PANTHER curated family FASTA library."
      homepage: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/download_panther/"
      documentation: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/download_panther/"
      tool_dev_url: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/download_panther/"
      licence: ["MIT"]
      identifier: ""
output:
  alignments:
    - - "PANTHER${params.panther_version}_fasta":
          type: file
          description: "PANTHER `.fasta` family files."
          pattern: "PANTHER${params.panther_version}_fasta"
  versions_curl:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - curl:
          type: string
          description: The tool name
      - curl --version | head -n 1 | sed 's/curl //; s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_tar:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tar:
          type: string
          description: The tool name
      - tar --version | head -n 1 | sed 's/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - curl:
          type: string
          description: The tool name
      - curl --version | head -n 1 | sed 's/curl //; s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tar:
          type: string
          description: The tool name
      - tar --version | head -n 1 | sed 's/.* //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
