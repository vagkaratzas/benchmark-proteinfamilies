---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "filter_valid_candidate_families"
description: "Keep only candidate families that actually exist in the downloaded databases."
keywords:
  - filter
  - interpro
  - metadata
tools:
  - "filter_valid_candidate_families":
      description: "Keep only candidate families that actually exist in the downloaded databases."
      homepage: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/filter_valid_candidate_families/"
      documentation: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/filter_valid_candidate_families/"
      tool_dev_url: "https://github.com/vagkaratzas/benchmark-proteinfamilies/tree/dev/modules/local/filter_valid_candidate_families/"
      licence: ["MIT"]
      identifier: ""
input:
  - - interpro:
        type: file
        description: "Candidate InterPro families."
        pattern: "*.tsv"
  - - metadata:
        type: file
        description: "Sampled family metadata CSV emitted by PRE."
        pattern: "*.{csv,tsv}"
output:
  metadata:
    - - "filtered_metadata.tsv":
          type: file
          description: "Candidate families that resolve to a real database family."
          pattern: "filtered_metadata.tsv"
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version 2>&1 | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pandas:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('pandas'))":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version 2>&1 | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pandas:
          type: string
          description: The tool name
      - python -c "import importlib.metadata; print(importlib.metadata.version('pandas'))":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
