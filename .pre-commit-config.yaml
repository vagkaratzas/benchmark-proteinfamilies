repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.6.2
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)^(
              modules/nf-core/.*|
              subworkflows/nf-core/.*
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              modules/nf-core/.*|
              subworkflows/nf-core/.*
          )$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Checks only. Never add `-format`: the formatter silently deletes comments that sit inside
      # a process `input:` / `output:` block, which is exactly where this pipeline explains its
      # non-obvious emits. See AGENTS.md -> Conventions that will bite you.
      - id: nextflow-lint
        name: nextflow lint
        entry: nextflow lint
        language: system
        files: '\.(nf|config)$'
        pass_filenames: false
        args: ["."]
